name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App and generate IPA
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'

    - name: Compile Real App and Generate Valid IPA
      run: |
        set -e
        mkdir -p build/Payload/WhiteStudio.app

        echo "Compiling WhiteStudio sources for a real iOS device..."
        xcrun -sdk iphoneos swiftc \
          -target arm64-apple-ios16.0 \
          -swift-version 5 \
          -parse-as-library \
          -emit-executable \
          -o build/Payload/WhiteStudio.app/WhiteStudio \
          WhiteStudio/*.swift

        PLIST_CONTENT='<?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>WhiteStudio</string>
            <key>CFBundleIdentifier</key>
            <string>com.whitestudio.app</string>
            <key>CFBundleName</key>
            <string>WhiteStudio</string>
            <key>CFBundleDisplayName</key>
            <string>White Studio</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
            </array>
        </dict>
        </plist>'

        printf '%s\n' "$PLIST_CONTENT" > build/Payload/WhiteStudio.app/Info.plist

        chmod +x build/Payload/WhiteStudio.app/WhiteStudio
        cd build && zip -r WhiteStudio.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhiteStudio-IPA
        path: build/WhiteStudio.ipa
