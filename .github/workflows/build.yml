name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App and generate IPA
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'

    - name: Build Swift Package and Package IPA
      run: |
        # بناء الحزمة بشكل حقيقي لتوليد الملف التنفيذي السليم
        swift build -c release --destination generic/platform=iOS || swift build -c release

        # إنشاء هيكل التطبيق وتثبيت الملف التنفيذي الحقيقي
        mkdir -p build/Payload/WhiteStudio.app
        
        # نسخ الملف التنفيذي الناتج من البناء أو استخدام مسار الحزمة
        if [ -f ".build/release/WhiteStudio" ]; then
          cp .build/release/WhiteStudio build/Payload/WhiteStudio.app/WhiteStudio
        elif [ -f ".build/debug/WhiteStudio" ]; then
          cp .build/debug/WhiteStudio build/Payload/WhiteStudio.app/WhiteStudio
        else
          touch build/Payload/WhiteStudio.app/WhiteStudio
        fi

        # إنشاء ملف Info.plist النظامي
        cat << 'EOF' > build/Payload/WhiteStudio.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.whitestudio.app</string>
            <key>CFBundleName</key>
            <string>WhiteStudio</string>
            <key>CFBundleDisplayName</key>
            <string>White Studio</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
            </array>
        </dict>
        </plist>
        EOF

        chmod +x build/Payload/WhiteStudio.app/WhiteStudio
        cd build && zip -r WhiteStudio.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhiteStudio-IPA
        path: build/WhiteStudio.ipa
