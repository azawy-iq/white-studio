name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App and generate IPA
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'

    - name: Create App Bundle and Info.plist
      run: |
        mkdir -p build/Payload/WhiteStudio.app
        
        # إنشاء ملف Info.plist الإلزامي لكي يقرأه النظام بدون أخطاء
        cat << 'EOF' > build/Payload/WhiteStudio.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        dict>
            <key>CFBundleIdentifier</key>
            <string>com.whitestudio.app</string>
            <key>CFBundleName</key>
            <string>WhiteStudio</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
        </dict>
        </plist>
        EOF

        # ملف تنفيذي فارغ لمنع الأخطاء
        touch build/Payload/WhiteStudio.app/WhiteStudio
        
        # ضغط الملف بصيغة IPA
        cd build && zip -r WhiteStudio.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhiteStudio-IPA
        path: build/WhiteStudio.ipa
