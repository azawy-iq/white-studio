name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS App and generate IPA
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'

    - name: Build Swift Package for iOS Simulator
      run: |
        swift build -arch arm64 -Xswiftc "-sdk" -Xswiftc "$(xcrun --sdk iphonesimulator --show-sdk-path)" --target WhiteStudio || swift build

    - name: Package Minimal App structure
      run: |
        mkdir -p build/Payload/WhiteStudio.app
        touch build/Payload/WhiteStudio.app/WhiteStudio
        cd build && zip -r WhiteStudio.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhiteStudio-IPA
        path: build/WhiteStudio.ipa
